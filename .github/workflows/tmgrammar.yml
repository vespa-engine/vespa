name: Vespa TextMate grammars

# The grammars in integration/tmgrammar/grammars/ are generated from the schema language server's
# CongoCC grammars and token configuration. Fail when a checked-in grammar no longer matches
# what its generator produces, so that parser changes and the grammars are updated together.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integration/tmgrammar/**'
      - 'integration/schema-language-server/language-server/src/main/ccc/**'
      - 'integration/schema-language-server/language-server/src/main/java/ai/vespa/schemals/lsp/schema/semantictokens/**'
      - 'integration/schema-language-server/language-server/src/main/java/ai/vespa/schemals/lsp/yqlplus/semantictokens/**'
      - 'integration/schema-language-server/language-server/src/main/java/ai/vespa/schemals/schemadocument/resolvers/RankExpression/BuiltInFunctions.java'
      - 'integration/schema-language-server/language-server/src/test/sdfiles/**'
      - '.github/workflows/tmgrammar.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: integration/tmgrammar

jobs:
  check:
    name: Check generated grammars
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check that the grammars are up to date
        run: |
          python3 tools/generate_tmgrammar.py > /dev/null
          python3 tools/generate_yql_tmgrammar.py > /dev/null
          if [ -n "$(git status --porcelain -- grammars/)" ]; then
            git status --short -- grammars/
            git diff -- grammars/
            echo "::error::A grammar in grammars/ is out of date. Run 'uv run tools/generate_tmgrammar.py' and 'uv run tools/generate_yql_tmgrammar.py' in integration/tmgrammar and commit the result."
            exit 1
          fi

      - name: Test the schema grammar
        run: python3 tools/test_tmgrammar.py

      - name: Test the YQL grammar
        run: python3 tools/test_yql_tmgrammar.py
