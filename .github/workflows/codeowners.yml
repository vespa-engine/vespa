name: Sync CODEOWNERS

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "**/OWNERS"
      - ".github/CODEOWNERS"
      - ".github/workflows/codeowners.yml"

permissions:
  contents: write

jobs:
  codeowners:
    uses: vespa-engine/gh-actions/.github/workflows/sync-codeowners.yml@b9b3093fe531392b08e7a71ffa8bcd88cb529bc3 # main
