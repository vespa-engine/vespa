name: Sync CODEOWNERS

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "**/OWNERS"
      - ".github/CODEOWNERS"
      - ".github/workflows/codeowners.yml"

permissions:
  contents: write

jobs:
  codeowners:
    uses: vespa-engine/gh-actions/.github/workflows/sync-codeowners.yml@91b830baf1512309037275142a06863ebd6534fc # main
