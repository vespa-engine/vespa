name: Label PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  external-contribution:
    if: >-
      github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - name: Add External Contribution label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels"
          -f 'labels[]=External Contribution'
          --silent

      - name: Check out comment template
        if: github.event.action == 'opened'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Welcome external contributor
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          -F 'body=@.github/pr-comments/external-contribution.md'
          --silent
