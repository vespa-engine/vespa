name: Delete old Cloudsmith artifacts

on:
  workflow_dispatch:

  pull_request:
    paths:
      - .github/workflows/delete-old-versions-in-archive.yml
      - .github/scripts/delete-old-cloudsmith-artifacts.sh
    branches:
      - master

  schedule:
   - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  delete-old-cloudsmith-artifacts:
    runs-on: ubuntu-latest

    container:
        image: almalinux:10@sha256:957738702313e6ee452cdb17bc1431542c467be9a4e2f4da3b8e551b0ebb9677
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CLOUDSMITH_API_TOKEN: ${{ secrets.CLOUDSMITH_API_TOKEN }}
        volumes:
          - ${{ github.workspace }}:/workspace

    defaults:
      run:
        working-directory: /workspace

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Delete old artifacts
        run: |
          .github/scripts/delete-old-cloudsmith-artifacts.sh
